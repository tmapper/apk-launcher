<!DOCTYPE html>
<html lang="tr"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Countryballs</title>
<style>
html,body{height:100%;margin:0;background:#0c0e14;color:#ece6da;font-family:Arial,sans-serif;display:flex;align-items:center;justify-content:center;text-align:center}
h2{letter-spacing:.08em;text-transform:uppercase;margin:0 0 12px}
p{color:#9aa1b2;margin:0}
.d{width:12px;height:12px;border-radius:50%;background:#d7263d;display:inline-block;margin:24px 4px 0;animation:b 1s infinite}
.d:nth-child(3){animation-delay:.2s}.d:nth-child(4){animation-delay:.4s}
@keyframes b{50%{opacity:.2}}
</style></head><body><div>
<h2>Countryballs: Fallout Suspects</h2>
<p id="st">Baglaniliyor...</p>
<span class="d"></span><span class="d"></span><span class="d"></span>
</div>
<script>
// GitHub raw + jsDelivr yedek
var CONFIG_URLS = [
  'https://raw.githubusercontent.com/tmapper/countryballs-config/main/server.json',
  'https://cdn.jsdelivr.net/gh/tmapper/countryballs-config@main/server.json'
];
var DEFAULT_SERVERS = ['https://countryballs-fallout-cv96.onrender.com'];

var KEY = 'cfs.launcherServers';
var st = document.getElementById('st');

function clean(l) {
  return (Array.isArray(l) ? l : [l]).map(function (s) {
    return String(s || '').trim().replace(/\/+$/, '');
  }).filter(Boolean);
}
function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
function withTimeout(url, opts, ms) {
  var ctl = new AbortController();
  var t = setTimeout(function () { ctl.abort(); }, ms);
  opts = opts || {};
  opts.signal = ctl.signal;
  opts.cache = 'no-store';
  return fetch(url, opts).finally(function () { clearTimeout(t); });
}

async function loadList(forceRemote) {
  for (var i = 0; i < CONFIG_URLS.length; i++) {
    var u = CONFIG_URLS[i];
    if (u.indexOf('KULLANICIADI') >= 0) continue;
    try {
      var res = await withTimeout(u + (u.indexOf('?') >= 0 ? '&' : '?') + 't=' + Date.now(), {}, 8000);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      var j = await res.json();
      var list = clean(j.servers || j.server);
      if (list.length) {
        try { localStorage.setItem(KEY, JSON.stringify(list)); } catch (e) {}
        return list;
      }
    } catch (e) { /* siradaki */ }
  }
  if (!forceRemote) {
    try {
      var c = clean(JSON.parse(localStorage.getItem(KEY) || '[]'));
      if (c.length) return c;
    } catch (e) {}
  }
  return clean(DEFAULT_SERVERS);
}

// CORS olmadigi icin status okunamaz; ag hatasi = false, cevap geldiyse true
function alive(url) {
  return withTimeout(url + '/?t=' + Date.now(), { mode: 'no-cors' }, 70000)
    .then(function () { return true; }, function () { return false; });
}

async function start() {
  var attempts = 0;
  while (true) {
    attempts++;
    st.textContent = 'Sunucu adresi aliniyor...';
    var list = await loadList(attempts > 1 && attempts % 3 === 0);
    for (var i = 0; i < list.length; i++) {
      st.textContent = 'Sunucuya baglaniliyor... (ilk acilista 30-60 sn surebilir)';
      if (await alive(list[i])) { location.replace(list[i]); return; }
    }
    try { localStorage.removeItem(KEY); } catch (e) {}
    st.textContent = 'Baglanilamadi, tekrar deneniyor...';
    await sleep(4000);
  }
}
start();
</script>
</body></html>
